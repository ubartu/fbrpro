[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-normalizer"
version = "0.1.0"
description = "Auditable football event, snapshot and tracking data normalization"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
tracking = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]

[project.scripts]
football-normalizer = "football_normalizer.cli:main"

[tool.setuptools.packages.find]
include = ["football_normalizer*"]
